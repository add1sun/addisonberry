title: Addison Berry
description: >-
  Some thoughts about volunteer leadership, existential health, and contemplative practice.
url: https://addisonberry.com
baseurl: ""

# Cayman, pulled in via jekyll-remote-theme so it can be overridden freely.
remote_theme: pages-themes/cayman@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Sender.net newsletter embed.
# sender_account_id  -> the value passed to sender('...') in the universal script
# sender_form_id     -> data-sender-form-id on the embed div
sender_account_id: "80702cf1b09807"
sender_form_id: "e31qgn"

author:
  name: Addison Berry

# Cayman renders these as buttons in the header when set.
# show_downloads: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
